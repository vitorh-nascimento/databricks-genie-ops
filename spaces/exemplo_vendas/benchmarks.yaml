      - "Divida o número de pedidos faturados pelo total de clientes únicos por segmento em 2026."
    ground_truth_sql: "SELECT c.segmento, ROUND(COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT p.id_cliente), 0), 2) AS pedidos_por_cliente FROM analytics_dev.sales_gold.fct_pedidos p JOIN analytics_dev.sales_gold.dim_clientes c ON p.id_cliente = c.id_cliente WHERE LEFT(p.competencia_faturamento, 4) = '2026' AND p.status_pedido = 'Faturado' GROUP BY c.segmento ORDER BY pedidos_por_cliente DESC"
