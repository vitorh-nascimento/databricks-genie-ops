  - id: bmk_16
    question: "Qual a participação percentual de cada segmento na receita líquida total de 2026?"
    ground_truth_sql: "WITH seg AS (SELECT c.segmento, SUM(p.valor_liquido) AS receita FROM analytics_dev.sales_gold.fct_pedidos p JOIN analytics_dev.sales_gold.dim_clientes c ON p.id_cliente = c.id_cliente WHERE LEFT(p.competencia_faturamento, 4) = '2026' AND p.status_pedido = 'Faturado' GROUP BY c.segmento) SELECT segmento, receita, ROUND(receita * 100.0 / SUM(receita) OVER (), 2) AS share_pct FROM seg ORDER BY share_pct DESC"
    expected_tables: ["fct_pedidos", "dim_clientes"]
    required_clauses: ["OVER", "segmento"]
    domain: "Clientes"
    difficulty: "hard"
    tags: ["window_function", "share"]
    mode: "chat"

  - id: bmk_17
    question: "Quantos novos clientes foram cadastrados por segmento em 2026?"
    ground_truth_sql: "SELECT segmento, COUNT(*) AS novos_clientes FROM analytics_dev.sales_gold.dim_clientes WHERE YEAR(data_cadastro) = 2026 GROUP BY segmento ORDER BY novos_clientes DESC"
    expected_tables: ["dim_clientes"]
    required_clauses: ["data_cadastro", "GROUP BY segmento"]
    domain: "Clientes"
    difficulty: "easy"
    tags: ["aquisicao", "dimensao"]
    mode: "chat"

  - id: bmk_18
    question: "Qual a diferença entre valor bruto e valor líquido por status de pedido em 2026-01?"
    ground_truth_sql: "SELECT status_pedido, SUM(valor_bruto) AS total_bruto, SUM(valor_liquido) AS total_liquido, SUM(valor_bruto - valor_liquido) AS diferenca FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' GROUP BY status_pedido"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY status_pedido", "valor_bruto", "valor_liquido"]
    domain: "Faturamento"
    difficulty: "medium"
    tags: ["comparativo"]
    mode: "chat"

  - id: bmk_19
    question: "Qual foi o crescimento percentual de receita líquida de 2026-02 em relação a 2026-01?"
    ground_truth_sql: "WITH mensal AS (SELECT competencia_faturamento, SUM(valor_liquido) AS receita FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento IN ('2026-01', '2026-02') AND status_pedido = 'Faturado' GROUP BY competencia_faturamento) SELECT ROUND((MAX(CASE WHEN competencia_faturamento = '2026-02' THEN receita END) - MAX(CASE WHEN competencia_faturamento = '2026-01' THEN receita END)) * 100.0 / NULLIF(MAX(CASE WHEN competencia_faturamento = '2026-01' THEN receita END), 0), 2) AS mom_pct FROM mensal"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["2026-01", "2026-02"]
    domain: "Faturamento"
    difficulty: "hard"
    tags: ["mom", "crescimento"]
    mode: "chat"

