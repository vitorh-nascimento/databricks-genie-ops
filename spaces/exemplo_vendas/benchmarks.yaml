  - id: bmk_14
    question: "Quais canais de venda tiveram receita líquida oficial acima de 500 mil em 2026-01 segundo a Metric View?"
    paraphrases:
      - "Na Metric View de KPIs comerciais, quais canais superaram R$ 500 mil de receita oficial em 2026-01?"
      - "Filtre os canais com faturamento oficial maior que 500.000 em janeiro de 2026 na mv_kpis_comerciais."
    ground_truth_sql: "SELECT canal_venda, MEASURE(receita_liquida_total) AS receita_oficial FROM analytics_dev.sales_gold.mv_kpis_comerciais WHERE competencia_faturamento = '2026-01' GROUP BY ALL HAVING MEASURE(receita_liquida_total) > 500000 ORDER BY receita_oficial DESC"
    expected_tables: ["mv_kpis_comerciais"]
    required_clauses: ["MEASURE(receita_liquida_total)", "HAVING"]
    domain: "KPIs Governados"
    difficulty: "hard"
    tags: ["metric_view", "having"]
    mode: "chat"

  - id: bmk_15
    question: "Qual o ticket médio e a taxa de desconto oficial por região em 2026-02 na Metric View?"
    paraphrases:
