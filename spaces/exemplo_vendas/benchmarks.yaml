    domain: "Descontos"
    difficulty: "easy"
    tags: ["agregacao", "desconto"]
    mode: "chat"

  - id: bmk_03
    question: "Qual a receita líquida faturada por região em março de 2026?"
    ground_truth_sql: "SELECT regiao, SUM(valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-03' AND status_pedido = 'Faturado' GROUP BY regiao ORDER BY receita_liquida DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY regiao", "2026-03"]
