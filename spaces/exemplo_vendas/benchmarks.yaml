  - id: bmk_10
    question: "Qual a taxa de cancelamento percentual por região em 2026-01?"
    ground_truth_sql: "SELECT regiao, ROUND(SUM(CASE WHEN status_pedido = 'Cancelado' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_cancelamento_pct FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' GROUP BY regiao ORDER BY taxa_cancelamento_pct DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["Cancelado", "GROUP BY regiao"]
    domain: "Operações"
    difficulty: "hard"
    tags: ["ratio", "cancelamento"]
    mode: "chat"

  - id: bmk_11
    question: "Qual o percentual médio de desconto concedido por canal de venda em 2026-03?"
    ground_truth_sql: "SELECT canal_venda, ROUND(SUM(valor_desconto) * 100.0 / NULLIF(SUM(valor_bruto), 0), 2) AS pct_desconto FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-03' AND status_pedido = 'Faturado' GROUP BY canal_venda ORDER BY pct_desconto DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["valor_desconto", "valor_bruto", "GROUP BY canal_venda"]
    domain: "Descontos"
    difficulty: "hard"
    tags: ["ratio", "desconto"]
    mode: "chat"

  - id: bmk_12
    question: "Quantos clientes únicos compraram no canal E-commerce em cada mês de 2026?"
    ground_truth_sql: "SELECT competencia_faturamento, COUNT(DISTINCT id_cliente) AS clientes_unicos FROM analytics_dev.sales_gold.fct_pedidos WHERE canal_venda = 'E-commerce' AND LEFT(competencia_faturamento, 4) = '2026' AND status_pedido = 'Faturado' GROUP BY competencia_faturamento ORDER BY competencia_faturamento"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["COUNT(DISTINCT id_cliente)", "E-commerce"]
