questions:
  - id: bmk_01
    question: "Qual foi a receita líquida total de pedidos faturados em janeiro de 2026?"
    paraphrases:
      - "Quanto faturamos líquido em 2026-01 considerando apenas pedidos confirmados?"
      - "Qual o total de receita líquida realizada em janeiro de 2026?"
    ground_truth_sql: "SELECT SUM(valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' AND status_pedido = 'Faturado'"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["SUM(valor_liquido)", "competencia_faturamento = '2026-01'", "status_pedido"]
    domain: "Faturamento"
    difficulty: "easy"
    tags: ["agregacao", "faturamento"]
    mode: "chat"

  - id: bmk_02
    question: "Qual o total de descontos concedidos em fevereiro de 2026?"
    paraphrases:
      - "Quanto demos de desconto em pedidos faturados na competência 2026-02?"
      - "Qual foi o montante total de abatimentos em fevereiro de 2026?"
    ground_truth_sql: "SELECT SUM(valor_desconto) AS total_desconto FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-02' AND status_pedido = 'Faturado'"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["SUM(valor_desconto)", "2026-02"]
    domain: "Descontos"
    difficulty: "easy"
    tags: ["agregacao", "desconto"]
    mode: "chat"

  - id: bmk_03
    question: "Qual a receita líquida faturada por região em março de 2026?"
    paraphrases:
      - "Mostre o faturamento líquido quebrado por macrorregião em 2026-03."
      - "Quanto cada praça comercial faturou líquido em março de 2026?"
    ground_truth_sql: "SELECT regiao, SUM(valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-03' AND status_pedido = 'Faturado' GROUP BY regiao ORDER BY receita_liquida DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY regiao", "2026-03"]
    domain: "Geografia"
    difficulty: "easy"
    tags: ["group_by", "regiao"]
    mode: "chat"

  - id: bmk_04
    question: "Quantos pedidos foram cancelados por canal de venda em 2026-01?"
    paraphrases:
      - "Qual o volume de cancelamentos por origem da venda em janeiro de 2026?"
      - "Liste a quantidade de pedidos com status Cancelado por canal em 2026-01."
    ground_truth_sql: "SELECT canal_venda, COUNT(*) AS pedidos_cancelados FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' AND status_pedido = 'Cancelado' GROUP BY canal_venda ORDER BY pedidos_cancelados DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY canal_venda", "Cancelado"]
    domain: "Operações"
    difficulty: "easy"
    tags: ["cancelamento", "canal"]
    mode: "chat"

  - id: bmk_05
    question: "Qual a distribuição da receita líquida por forma de pagamento em 2026-02?"
    paraphrases:
      - "Como ficou o faturamento líquido por meio de pagamento em fevereiro de 2026?"
      - "Agrupe a receita realizada em 2026-02 por forma de pagamento."
    ground_truth_sql: "SELECT forma_pagamento, SUM(valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-02' AND status_pedido = 'Faturado' GROUP BY forma_pagamento ORDER BY receita_liquida DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY forma_pagamento", "SUM(valor_liquido)"]
    domain: "Pagamentos"
    difficulty: "easy"
    tags: ["pagamento", "group_by"]
    mode: "chat"

  - id: bmk_06
    question: "Qual a evolução mensal da receita líquida faturada ao longo de 2026?"
    paraphrases:
      - "Mostre a série histórica mês a mês do faturamento líquido em 2026."
      - "Como a receita confirmada variou por competência durante o ano de 2026?"
    ground_truth_sql: "SELECT competencia_faturamento, SUM(valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos WHERE LEFT(competencia_faturamento, 4) = '2026' AND status_pedido = 'Faturado' GROUP BY competencia_faturamento ORDER BY competencia_faturamento"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["GROUP BY competencia_faturamento", "ORDER BY competencia_faturamento"]
    domain: "Faturamento"
    difficulty: "medium"
    tags: ["serie_temporal"]
    mode: "chat"

  - id: bmk_07
    question: "Quais os 5 clientes com maior receita líquida faturada em 2026?"
    paraphrases:
      - "Quem são os top 5 clientes por faturamento líquido realizado em 2026?"
      - "Liste as cinco maiores contas em receita líquida confirmada no ano de 2026."
    ground_truth_sql: "SELECT c.nome_cliente, SUM(p.valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos p JOIN analytics_dev.sales_gold.dim_clientes c ON p.id_cliente = c.id_cliente WHERE LEFT(p.competencia_faturamento, 4) = '2026' AND p.status_pedido = 'Faturado' GROUP BY c.nome_cliente ORDER BY receita_liquida DESC LIMIT 5"
    expected_tables: ["fct_pedidos", "dim_clientes"]
    required_clauses: ["JOIN", "nome_cliente", "LIMIT 5"]
    domain: "Clientes"
    difficulty: "medium"
    tags: ["join", "ranking"]
    mode: "chat"

  - id: bmk_08
    question: "Qual foi o faturamento de clientes do segmento Enterprise na região Sudeste em 2026-01?"
    paraphrases:
      - "Quanto faturamos com grandes contas Enterprise no Sudeste em janeiro de 2026?"
      - "Qual a receita líquida faturada da carteira Enterprise na região Sudeste em 2026-01?"
    ground_truth_sql: "SELECT SUM(p.valor_liquido) AS receita_enterprise_se FROM analytics_dev.sales_gold.fct_pedidos p JOIN analytics_dev.sales_gold.dim_clientes c ON p.id_cliente = c.id_cliente WHERE c.segmento = 'Enterprise' AND p.regiao = 'Sudeste' AND p.competencia_faturamento = '2026-01' AND p.status_pedido = 'Faturado'"
    expected_tables: ["fct_pedidos", "dim_clientes"]
    required_clauses: ["Enterprise", "Sudeste", "2026-01"]
    domain: "Clientes"
    difficulty: "medium"
    tags: ["join", "filtros_combinados"]
    mode: "chat"

  - id: bmk_09
    question: "Qual a receita líquida por UF para clientes de porte Grande em 2026?"
    paraphrases:
      - "Mostre o faturamento líquido por estado considerando somente empresas de grande porte em 2026."
      - "Quanto clientes de porte Grande faturaram em cada UF ao longo de 2026?"
    ground_truth_sql: "SELECT c.uf, SUM(p.valor_liquido) AS receita_liquida FROM analytics_dev.sales_gold.fct_pedidos p JOIN analytics_dev.sales_gold.dim_clientes c ON p.id_cliente = c.id_cliente WHERE c.porte_empresa = 'Grande' AND LEFT(p.competencia_faturamento, 4) = '2026' AND p.status_pedido = 'Faturado' GROUP BY c.uf ORDER BY receita_liquida DESC"
    expected_tables: ["fct_pedidos", "dim_clientes"]
    required_clauses: ["porte_empresa", "GROUP BY c.uf"]
    domain: "Geografia"
    difficulty: "medium"
    tags: ["join", "uf"]
    mode: "chat"

  - id: bmk_10
    question: "Qual a taxa de cancelamento percentual por região em 2026-01?"
    paraphrases:
      - "Qual o percentual de pedidos cancelados em cada macrorregião em janeiro de 2026?"
      - "Calcule o churn de pedidos por região na competência 2026-01."
    ground_truth_sql: "SELECT regiao, ROUND(SUM(CASE WHEN status_pedido = 'Cancelado' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_cancelamento_pct FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' GROUP BY regiao ORDER BY taxa_cancelamento_pct DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["Cancelado", "GROUP BY regiao"]
    domain: "Operações"
    difficulty: "hard"
    tags: ["ratio", "cancelamento", "trusted_asset"]
    mode: "chat"

  - id: bmk_11
    question: "Qual o percentual médio de desconto concedido por canal de venda em 2026-03?"
    paraphrases:
      - "Qual foi a taxa efetiva de desconto por canal comercial em março de 2026?"
      - "Calcule o desconto percentual sobre o valor bruto por origem da venda em 2026-03."
    ground_truth_sql: "SELECT canal_venda, ROUND(SUM(valor_desconto) * 100.0 / NULLIF(SUM(valor_bruto), 0), 2) AS pct_desconto FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-03' AND status_pedido = 'Faturado' GROUP BY canal_venda ORDER BY pct_desconto DESC"
    expected_tables: ["fct_pedidos"]
    required_clauses: ["valor_desconto", "valor_bruto", "GROUP BY canal_venda"]
    domain: "Descontos"
    difficulty: "hard"
    tags: ["ratio", "desconto"]
    mode: "chat"

