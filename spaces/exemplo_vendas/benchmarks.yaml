    ground_truth_sql: "SELECT regiao, COUNT(*) AS qtd_pendentes, SUM(valor_liquido) AS valor_pendente FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-03' AND status_pedido = 'Pendente' GROUP BY regiao ORDER BY valor_pendente DESC"
