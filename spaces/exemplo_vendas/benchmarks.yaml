    tags: ["group_by", "regiao"]
    mode: "chat"

  - id: bmk_04
    question: "Quantos pedidos foram cancelados por canal de venda em 2026-01?"
    ground_truth_sql: "SELECT canal_venda, COUNT(*) AS pedidos_cancelados FROM analytics_dev.sales_gold.fct_pedidos WHERE competencia_faturamento = '2026-01' AND status_pedido = 'Cancelado' GROUP BY canal_venda ORDER BY pedidos_cancelados DESC"
    expected_tables: ["fct_pedidos"]
