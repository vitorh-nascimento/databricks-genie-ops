join_specs:
  - left:
      identifier: analytics_dev.sales_gold.fct_pedidos
      alias: fct_pedidos
    right:
      identifier: analytics_dev.sales_gold.dim_clientes
      alias: dim_clientes
    condition: "`fct_pedidos`.`id_cliente` = `dim_clientes`.`id_cliente`"
    relationship_type: MANY_TO_ONE

sql_snippets:
  measures:
    - alias: receita_liquida_faturada
      display_name: Receita Líquida Faturada
      sql: "SUM(CASE WHEN fct_pedidos.status_pedido = 'Faturado' THEN fct_pedidos.valor_liquido ELSE 0 END)"
      synonyms:
        - faturamento confirmado
        - receita realizada
    - alias: taxa_cancelamento_pct
      display_name: Taxa de Cancelamento (%)
      sql: "ROUND(SUM(CASE WHEN fct_pedidos.status_pedido = 'Cancelado' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(fct_pedidos.id_pedido), 0), 2)"
      synonyms:
        - percentual de cancelamento
        - churn de pedidos
  filters:
    - display_name: Pedidos Faturados
      sql: "fct_pedidos.status_pedido = 'Faturado'"
      synonyms:
        - vendas efetivas
        - pedidos válidos
    - display_name: Pedidos Enterprise
      sql: "dim_clientes.segmento = 'Enterprise'"
      synonyms:
        - grandes contas
  expressions:
    - alias: ano_faturamento
      display_name: Ano de Faturamento
      sql: "LEFT(fct_pedidos.competencia_faturamento, 4)"
      synonyms:
        - ano fiscal

example_question_sqls:
  - question: "Qual foi o faturamento líquido mensal por canal no primeiro trimestre de 2025?"
    sql: >-
      SELECT fct_pedidos.competencia_faturamento, fct_pedidos.canal_venda,
      SUM(fct_pedidos.valor_liquido) AS receita_liquida
      FROM analytics_dev.sales_gold.fct_pedidos AS fct_pedidos
      WHERE fct_pedidos.competencia_faturamento BETWEEN '2025-01' AND '2025-03'
      AND fct_pedidos.status_pedido = 'Faturado'
      GROUP BY fct_pedidos.competencia_faturamento, fct_pedidos.canal_venda
      ORDER BY fct_pedidos.competencia_faturamento, receita_liquida DESC
  - question: "Como consultar os KPIs oficiais de receita líquida e ticket médio na Metric View por região?"
    sql: >-
      SELECT regiao, MEASURE(receita_liquida_total) AS receita_oficial,
      MEASURE(ticket_medio) AS ticket_medio
      FROM analytics_dev.sales_gold.mv_kpis_comerciais
      WHERE competencia_faturamento = '2025-12'
      GROUP BY ALL
      ORDER BY receita_oficial DESC
  - question: "Qual o ranking de segmentos de clientes por receita faturada em 2025?"
    sql: >-
      SELECT dim_clientes.segmento, SUM(fct_pedidos.valor_liquido) AS receita_liquida,
      COUNT(DISTINCT fct_pedidos.id_cliente) AS clientes_ativos
      FROM analytics_dev.sales_gold.fct_pedidos AS fct_pedidos
      JOIN analytics_dev.sales_gold.dim_clientes AS dim_clientes
      ON fct_pedidos.id_cliente = dim_clientes.id_cliente
      WHERE LEFT(fct_pedidos.competencia_faturamento, 4) = '2025'
      AND fct_pedidos.status_pedido = 'Faturado'
      GROUP BY dim_clientes.segmento
      ORDER BY receita_liquida DESC

text_instructions:
  - "Responda em português objetivo, informando o período de competência analisado e valores em Reais (R$)."
  - "Para perguntas de KPIs executivos consolidados, prefira a Metric View mv_kpis_comerciais usando MEASURE(); para análises por cliente individual ou forma de pagamento, consulte fct_pedidos com dim_clientes."
  - "Perguntas sobre alçadas de desconto, políticas comerciais ou regras de devolução devem consultar os documentos do volume politicas_comerciais e citar o arquivo fonte."

sample_questions:
  - "Qual foi a receita líquida faturada por região em 2026-01?"
  - "Quais são os 10 maiores clientes Enterprise por faturamento no último trimestre?"
  - "Qual a taxa de cancelamento por canal de venda em 2026?"
  - "Qual o ticket médio oficial por canal na Metric View de KPIs comerciais?"
  - "Qual é a alçada de aprovação necessária para descontos acima de 15% segundo a política comercial?"
